name: Go Nancy

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["master", "develop"]

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.24.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install Nancy
        run: |
          curl -sSL -o nancy https://github.com/sonatype-nexus-community/nancy/releases/download/v1.0.52/nancy-v1.0.52-linux-amd64
          chmod +x nancy
          sudo mv nancy /usr/local/bin/
          file /usr/local/bin/nancy


      - name: Nancy Scan
        run: |
          echo "1244"
          echo "OSSINDEX_USERNAME(secret):" "${{ secrets.OSSINDEX_USERNAME }}"
          echo "OSSINDEX_TOKEN(secret):"    "${{ secrets.OSSINDEX_TOKEN }}"
          echo "OSSINDEX_USERNAME length: ${#OSSINDEX_USERNAME}"
          echo "OSSINDEX_TOKEN length: ${#OSSINDEX_TOKEN}"

          echo "Step started"
          echo "Secrets masked:"
          echo "OSSINDEX_USERNAME(secret): ${{ secrets.OSSINDEX_USERNAME }}"
          echo "OSSINDEX_TOKEN(secret): ${{ secrets.OSSINDEX_TOKEN }}"

          echo "Env lengths (0 表示未注入):"
           echo "OSSINDEX_USERNAME length: ${#OSSINDEX_USERNAME:-0}"
          echo "OSSINDEX_TOKEN length: ${#OSSINDEX_TOKEN:-0}"

          go list -json -deps ./... | nancy sleuth --loud